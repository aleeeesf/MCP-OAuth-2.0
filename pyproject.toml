[project]
name = "oauth-mcp"
version = "0.1.0"
description = "OAuth 2.0 Authorization Server + MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
